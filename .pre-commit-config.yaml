repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: "^data/"
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: debug-statements

  # ruff is the single formatter + linter (replaces black + isort).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-large-model-files
        name: Block large model/data files
        entry: bash -c 'git diff --cached --name-only | grep -E "\.(pt|bin|pth|gguf|safetensors|npz|npy|arrow)$" && echo "Large model/data files must not be committed. Use HuggingFace Hub." && exit 1 || exit 0'
        language: system
        pass_filenames: false
