output_dir: outputs/classifier
num_train_epochs: 5
per_device_train_batch_size: 32
per_device_eval_batch_size: 64
learning_rate: 1.0e-3
weight_decay: 1.0e-4
warmup_ratio: 0.1
logging_steps: 50
# save strategy/steps auto-follow eval when load_best_model_at_end=true,
# so just switch eval_strategy below (epoch | steps) and it stays consistent.
eval_strategy: epoch
eval_steps: 100
load_best_model_at_end: true
# Select on macro-F1 (balanced separation for the reward model), not accuracy which
# the majority `standard` class dominates.
metric_for_best_model: f1_macro
greater_is_better: true
# Self-terminate when macro-F1 plateaus for N evals (prevents both the manual-kill
# undertraining we saw and overtraining). null disables.
early_stopping_patience: 5
fp16: true
bf16: false
seed: 42
