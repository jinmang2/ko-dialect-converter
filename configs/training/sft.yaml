# Backend / precision — defaults are RTX 2060 (Turing, fp16-only) safe.
# backend: unsloth | bnb | hf | loftq | awq | gptq | qat
backend: unsloth
dtype: fp16  # fp16 | bf16 (Ampere+) | fp32
# Data shaping / loss masking (see data/template.py + dataset.output_mode)
template_name: default        # registered chat template
output_mode: text             # text (pre-rendered) | structured (render at train time)
loss_on: all                  # all | completion | assistant  (needs output_mode=structured)
packing: true
save_merged: true             # write merged 16-bit so stage3 GRPO loads trained weights
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
output_dir: outputs/sft
num_train_epochs: 2
per_device_train_batch_size: 4
per_device_eval_batch_size: 8   # eval has no backward pass; raise if VRAM allows
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
warmup_ratio: 0.05
lr_scheduler_type: cosine
save_steps: 500
logging_steps: 50
eval_strategy: steps
eval_steps: 500
# Early stopping (opt-in): set early_stopping_patience to a positive int + needs an eval set.
# load_best_model_at_end restores the best checkpoint (by metric_for_best_model) before saving.
save_strategy: steps
load_best_model_at_end: false
metric_for_best_model: eval_loss
greater_is_better: false
early_stopping_patience: null
fp16: true
bf16: false
# --- training-optimization knobs (benchmark with scripts/bench_train.py) ---
optim: adamw_torch            # paged_adamw_8bit shrinks optimizer state on 6GB
gradient_checkpointing: false # true trades recompute for activation memory (unsloth self-manages)
deepspeed: null               # e.g. configs/training/deepspeed_zero2_offload.json (use backend=bnb/hf, not unsloth)
dataloader_num_workers: 0
seed: 42
num_train_samples: 150000
# Spend `num_train_samples` equally across regions instead of proportionally. The corpus
# is skewed against the regions that need help: Jeju is 8.4% of a proportional draw and
# scores *below* the copy-the-input baseline, while Gyeongsang is 31% and already beats
# it by +27 chrF (docs/CORPUS_ANALYSIS_5REGION.md). Off by default for reproducibility.
balance_regions: false
# Eval cost scales with the CORPUS, not with this config, so a default of `null`
# (evaluate everything) silently explodes when the corpus grows. Measured 2026-08-05:
# the 2-region valid set was 45,061 rows and one eval took 60 min; the 5-region set is
# 183,406 rows and one eval took 172 min — at eval_steps=500 that is 25.7 h of eval
# around 3.2 h of actual training, i.e. 89% of the wall clock. 2,000 rows costs ~4 min
# and is ample for an eval_loss curve. Raise it deliberately for a final measurement.
num_eval_samples: 2000
