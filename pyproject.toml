[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ko-dialect-converter"
version = "0.2.0"
description = "Korean dialect ↔ standard Korean via QLoRA / GRPO fine-tuning"
requires-python = ">=3.11"
dependencies = [
    # Core ML stack.
    # torch is PINNED and served from the CUDA-13 wheel index (see [tool.uv.sources]).
    # 2.11.0+cu130 is the combination validated on this box: RTX 2060 / Turing SM 7.5,
    # fp16-only. Do not float this — 2.13 resolves a different CUDA dep set, and the
    # GRPO playbook's fixes are pinned to trl 1.5.1 + transformers 5.5.4 + torch 2.11.
    "torch==2.11.0",
    "torchvision",
    "transformers",
    "datasets",
    "accelerate",
    "peft",
    "trl",
    "huggingface_hub",
    "bitsandbytes",
    "torchao",

    # Fine-tuning notes (pinned dupes removed; see top block)
    # deepspeed: optional, install separately for ZeRO offload
    # unsloth: install separately (CUDA-specific wheel)
    # see: https://github.com/unslothai/unsloth#installation

    # Evaluation
    "sacrebleu>=2.4.0",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.4.0",
    "orjson",
    "ujson",

    # Config & CLI
    "pyyaml>=6.0",
    "fire>=0.6.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
    "hydra-core>=1.3.0",

    # Resolve requests dependency warning
    "requests>=2.31.0",
    "urllib3>=1.26.18",
    "charset-normalizer>=3.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "types-PyYAML>=6.0.0",
]
# Opt-in extras kept out of core so CPU CI / minimal installs stay lean.
track   = ["wandb>=0.18", "mlflow>=2.15.0"]   # logger=wandb | logger=mlflow
datagen = ["openai>=1.50", "google-genai"]    # synthetic-data generation scripts
serve   = ["open-webui", "ipywidgets"]         # serving UI / notebooks
eval    = ["lm_eval>=0.4"]
# NOTE: `vllm` is deliberately NOT an extra. `uv lock` resolves every extra, and the
# PyPI sdist for this platform tries to compile against /usr/local/cuda/bin/nvcc, which
# is absent here — that single extra made the whole lockfile unbuildable. vllm is
# installed from git by `make install-vllm`, same as unsloth. Keep it out of the lock.
speech  = ["faster-whisper>=1.0", "torchaudio", "soundfile"]   # src/ko_dialect/speech (ASR + audio F0)

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501", "F821"]

[tool.ruff.lint.isort]
known-local-folder = ["app", "src"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires CUDA GPU (skipped in CI)",
]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# uv project configuration
# --------------------------------------------------------------------------- #
# torch must come from PyTorch's CUDA-13 wheel index, not PyPI (PyPI's `torch` is the
# CPU/cu12 build). `explicit = true` means this index is used ONLY for the packages
# mapped to it below — everything else still resolves from PyPI.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.uv]
# unsloth ships a CUDA-specific wheel from git and is intentionally NOT a locked
# dependency (`make install-unsloth`); keeping it out lets CPU-only CI resolve.
default-groups = []
