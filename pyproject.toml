[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ko-dialect-converter"
version = "0.2.0"
description = "Korean dialect ↔ standard Korean via QLoRA / GRPO fine-tuning"
requires-python = ">=3.11"
dependencies = [
    # Core ML stack
    "torch>=2.2.0",
    "transformers>=4.44.0",
    "datasets>=2.20.0",
    "accelerate>=0.33.0",

    # Fine-tuning
    "trl>=0.9.6",
    "peft>=0.12.0",
    "bitsandbytes>=0.43.0",
    # deepspeed: optional, install separately for ZeRO offload
    # unsloth: install separately (CUDA-specific wheel)
    # see: https://github.com/unslothai/unsloth#installation

    # Evaluation
    "evaluate>=0.4.2",
    "sacrebleu>=2.4.0",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.4.0",

    # Config & CLI
    "pyyaml>=6.0",
    "fire>=0.6.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",

    # Experiment management
    "hydra-core>=1.3.0",
    "mlflow>=2.15.0",
    "wandb>=0.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "types-PyYAML>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501", "F821"]

[tool.ruff.lint.isort]
known-local-folder = ["app", "src"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires CUDA GPU (skipped in CI)",
]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
