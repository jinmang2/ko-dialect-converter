[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ko-dialect-converter"
version = "0.2.0"
description = "Korean dialect ↔ standard Korean via QLoRA / GRPO fine-tuning"
requires-python = ">=3.11"
dependencies = [
    # Core ML stack
    # "torch>=2.2.0", # make install-torch
    "transformers",
    "datasets",
    "accelerate",
    "peft",
    "trl",
    "huggingface_hub",
    "bitsandbytes",
    "torchao",

    # Fine-tuning notes (pinned dupes removed; see top block)
    # deepspeed: optional, install separately for ZeRO offload
    # unsloth: install separately (CUDA-specific wheel)
    # see: https://github.com/unslothai/unsloth#installation

    # Evaluation
    "sacrebleu>=2.4.0",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.4.0",
    "orjson",
    "ujson",

    # Config & CLI
    "pyyaml>=6.0",
    "fire>=0.6.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
    "hydra-core>=1.3.0",

    # Resolve requests dependency warning
    "requests>=2.31.0",
    "urllib3>=1.26.18",
    "charset-normalizer>=3.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "types-PyYAML>=6.0.0",
]
# Opt-in extras kept out of core so CPU CI / minimal installs stay lean.
track   = ["wandb>=0.18", "mlflow>=2.15.0"]   # logger=wandb | logger=mlflow
datagen = ["openai>=1.50", "google-genai"]    # synthetic-data generation scripts
serve   = ["open-webui", "ipywidgets"]         # serving UI / notebooks
eval    = ["lm_eval>=0.4"]
vllm    = ["vllm"]
speech  = ["faster-whisper>=1.0", "torchaudio", "soundfile"]   # src/ko_dialect/speech (ASR + audio F0)

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501", "F821"]

[tool.ruff.lint.isort]
known-local-folder = ["app", "src"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires CUDA GPU (skipped in CI)",
]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
