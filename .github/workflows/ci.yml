name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: pip install "ruff==0.15.15"

      - name: ruff check (lint + import order)
        run: ruff check . --exclude .git

      - name: ruff format (style)
        run: ruff format --check .

  test:
    name: Tests (CPU-only)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test deps
        run: pip install pytest pytest-cov

      - name: Run tests (skip GPU, skip if no tests yet)
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -x -q -m "not gpu" --tb=short
          else
            echo "No tests directory yet — skipping"
          fi
