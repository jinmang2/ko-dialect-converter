name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: pip install "ruff==0.15.15"

      - name: ruff check (lint + import order)
        run: ruff check . --exclude .git

      - name: ruff format (style)
        run: ruff format --check .

  test:
    name: Tests (CPU-only)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + CPU deps
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Import check
        run: python -c "import ko_dialect; from ko_dialect.evaluation import evaluate_all, EvalConfig"

      - name: Run tests (skip GPU)
        run: pytest tests/ -x -q -m "not gpu" --tb=short
