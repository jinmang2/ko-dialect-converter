name: Feature Request
description: 새로운 기능, 개선, 실험 아이디어 제안
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        새 기능 또는 개선 사항을 제안해주세요.

  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      multiple: true
      options:
        - data pipeline
        - model architecture / quantization
        - training (QLoRA / PTQ+LoRA)
        - evaluation / metrics
        - serving / GGUF export
        - CI/CD / tooling
        - documentation
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 동기 / 문제 상황
      placeholder: 어떤 문제를 해결하려고 하나요? 현재 어떤 불편함이 있나요?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      placeholder: 어떤 방식으로 구현하면 좋을지 구체적으로 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      placeholder: 다른 방법도 생각해봤나요?
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위 (본인 기준)
      options:
        - 높음 — 없으면 진행 불가
        - 중간 — 있으면 좋음
        - 낮음 — 나중에
    validations:
      required: false
