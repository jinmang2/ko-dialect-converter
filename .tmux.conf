# Project tmux config — load with:  tmux -f .tmux.conf new-session
# or inside a running session:       tmux source-file .tmux.conf

# Drag the mouse UPWARD to scroll back through logs (enters copy-mode);
# wheel scroll works too. This is the main thing we want for watching eval logs.
set -g mouse on

# Keep a deep scrollback so long training/eval logs stay reachable.
set -g history-limit 100000

# vi-style keys in copy-mode (k/j to move, / to search, q to exit).
setw -g mode-keys vi
