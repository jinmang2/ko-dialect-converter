# tmux config for KoDialect eval sessions (isolated server: tmux -L ko_eval)
# Loaded by scripts/run_eval_tmux.sh — does not affect your global ~/.tmux.conf.

# --- Drag-to-scroll: the headline feature ------------------------------------
# Mouse on => dragging upward enters copy-mode and scrolls the scrollback buffer,
# so you can drag to read log lines that scrolled off the top. Wheel scroll works
# too. Drag-select copies; release to exit.
set -g mouse on

# Keep a deep scrollback so a long eval run's logs stay reachable by dragging.
set -g history-limit 200000

# vi-style keys in copy-mode (k/j, /search, etc.)
setw -g mode-keys vi

# Drag-select copies to the tmux buffer and stays in copy-mode-friendly behavior.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
# Click anywhere to also leave copy-mode quickly
bind -T copy-mode-vi q send -X cancel

# --- Quality-of-life ----------------------------------------------------------
set -g base-index 1            # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0          # snappier ESC
set -g focus-events on
set -g display-time 2000

# Readable status bar showing session + clock + a hint.
set -g status-interval 5
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[bold] ko_eval:#S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=colour110]drag↑ to scroll  #[fg=colour250]%H:%M:%S "
set -g status-right-length 40

# r reloads this config without restarting the session.
bind r source-file "#{TMUX_CONF_PATH}" \; display "config reloaded"
